[package]
name = "discord-rust"
description = "Write complete Discord bots in Rust. A port of discord.js. Unofficial."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "discord"

[lints]
workspace = true

[features]
default = ["zlib"]
zlib = ["dr-gateway/zlib"]
# Voice channels: joining, Opus playback, receiving, and DAVE end-to-end encryption.
voice = ["dep:dr-voice", "dr-voice/dave"]

[dependencies]
dr-core.workspace = true
dr-model.workspace = true
dr-builders.workspace = true
dr-rest.workspace = true
dr-gateway.workspace = true
dr-cache.workspace = true
dr-voice = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
compact_str.workspace = true

[dev-dependencies]
dr-mock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt"] }

[[example]]
name = "voice_bot"
required-features = ["voice"]
