[package]
name = "discord-rust-voice"
description = "Discord voice connections for discord.rs: voice gateway, UDP, encryption, DAVE and playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dr_voice"

[lints]
workspace = true

[features]
default = ["dave"]
# Discord's end-to-end encryption for voice, which Discord requires of every client.
dave = ["dep:davey"]

[dependencies]
dr-core.workspace = true
dr-model.workspace = true
dr-gateway.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "net", "fs", "io-util"] }
tokio-tungstenite.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rand.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
davey = { workspace = true, optional = true }

[dev-dependencies]
dr-mock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# The DAVE test plays the voice gateway's MLS external sender, with the same openmls as davey.
davey.workspace = true
openmls = "0.8.3"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
