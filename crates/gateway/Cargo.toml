[package]
name = "discord-rust-gateway"
description = "Discord gateway shard and manager for discord.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dr_gateway"

[lints]
workspace = true

[features]
default = []
zlib = ["dep:flate2"]

[dependencies]
dr-core.workspace = true
dr-model.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
compact_str.workspace = true
rand.workspace = true
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
flate2 = { workspace = true, optional = true }

[dev-dependencies]
dr-mock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
